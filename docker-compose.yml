services:
  conecta:
    build:
      context: .
      dockerfile: Dockerfile
    image: conecta-mais-hotspot:latest
    container_name: conecta-mais
    restart: unless-stopped
    init: true
    networks:
      conecta_network:
        ipv4_address: "${DOCKER_STATIC_IP}"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      NODE_ENV: production
      PORT: 80
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      PROVISIONING_DATA_DIR: /data
      ACTIVATION_TOKEN_SECRET: "${ACTIVATION_TOKEN_SECRET}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET}"
      MERCADO_PAGO_ACCESS_TOKEN: "${MERCADO_PAGO_ACCESS_TOKEN:-}"
      MERCADO_PAGO_WEBHOOK_SECRET: "${MERCADO_PAGO_WEBHOOK_SECRET:-}"
      PIX_BLOCKED_DOMAINS: "${PIX_BLOCKED_DOMAINS:-facebook.com,facebook.net,fbcdn.net,instagram.com,cdninstagram.com,whatsapp.com,whatsapp.net,tiktok.com,tiktokcdn.com,twitter.com,x.com,twimg.com,youtube.com,youtu.be,googlevideo.com,google.com,connectivitycheck.gstatic.com,captive.apple.com,msftconnecttest.com}"
      PIX_TEMP_RATE_LIMIT: "${PIX_TEMP_RATE_LIMIT:-1M/1M}"
      PIX_PRICE_5: "${PIX_PRICE_5:-1.00}"
      PIX_PRICE_10: "${PIX_PRICE_10:-2.00}"
      PIX_PRICE_15: "${PIX_PRICE_15:-3.00}"
      PIX_PRICE_30: "${PIX_PRICE_30:-5.00}"
      PIX_PRICE_60: "${PIX_PRICE_60:-8.00}"
    volumes:
      - conecta_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  conecta_data:

networks:
  conecta_network:
    external: true
    name: "${DOCKER_NETWORK_NAME}"
